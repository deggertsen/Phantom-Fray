; Copy to export_credentials.cfg (ignored by Git) and fill in. Never commit the real file.
; Read by tools/build_quest_release.ps1 (keystore) and tools/upload_quest_build.ps1 (Meta).

; Release signing. The keystore itself is ignored too; back it up off this machine.
keystore/release="C:/path/to/phantom-fray-release.keystore"
keystore/release_user="phantom-fray"
keystore/release_password=""

; Meta Horizon developer dashboard, your app, Development > API.
; App ID is shown there; App Credentials is the app secret. Treat it like a password.
meta/app_id=""
meta/app_secret=""
; Or a user token instead of the secret:
; meta/token=""
